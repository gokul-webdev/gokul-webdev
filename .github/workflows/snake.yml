name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"      # every 12 hours
  workflow_dispatch:             # lets you run it manually from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#A78BFA&color_dots=#2d3343,#22D3EE,#10B981,#7C3AED,#A78BFA
            dist/snake-light.svg?palette=github-light&color_snake=#7C3AED&color_dots=#eef2f8,#0891B2,#059669,#7C3AED,#A78BFA

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
